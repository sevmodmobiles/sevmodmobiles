<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка ввода</title>
<style>
  body { font-family: -apple-system, Roboto, Arial, sans-serif; margin: 0; padding: 16px; background: #f4f5f7; color: #1c1c1e; }
  h1 { font-size: 20px; } p { color: #555; font-size: 14px; line-height: 1.4; }
  label { display: block; font-size: 13px; color: #6b7280; margin: 14px 0 6px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 13px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-family: inherit; }
</style></head><body>
<h1>Проверка ввода текста</h1>
<p>В каждом поле: поставьте курсор в середину слова «привет» и напечатайте букву. Напишите, в каких полях буква встала на место курсора, а в каких — в конец.</p>
<label>1. Обычное поле (input)</label>
<input type="text" value="привет мир">
<label>2. Поле с autocomplete="off" (как в приложении)</label>
<input type="text" autocomplete="off" value="привет мир">
<label>3. Многострочное поле (textarea)</label>
<textarea rows="2">привет мир</textarea>
<label>4. Многострочное поле, как комментарии в приложении</label>
<textarea rows="1" style="resize:none;overflow:hidden;min-height:50px" oninput="this.style.height='auto';this.style.height=this.scrollHeight+2+'px'">привет мир</textarea>
</body></html>
